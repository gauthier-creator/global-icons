<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cockpit SEO · Global Icons</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__title">Cockpit SEO</span>
      <span class="topbar__sub">Global Icons · rankings par verticale</span>
    </div>
    <div class="topbar__actions">
      <button id="scanBtn" class="btn btn--primary">Re-scan</button>
    </div>
  </header>

  <section class="meta" id="metaBar">
    <span id="metaLastScan">Chargement…</span>
    <span id="metaTotal"></span>
    <span id="metaSource">Source · positions Google live (Serper.dev)</span>
  </section>

  <nav class="tabs" id="tabs" aria-label="Verticales"></nav>

  <main class="content" id="content">
    <div class="empty" id="emptyState" hidden>
      <h2>Aucun scan encore</h2>
      <p>Cliquez sur <strong>Re-scan</strong> en haut à droite pour interroger Google Search Console.</p>
    </div>
    <div class="loading" id="loadingState" hidden>Chargement…</div>
    <div id="verticalView"></div>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
